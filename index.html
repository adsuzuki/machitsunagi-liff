<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>交流会 参加受付</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg: #FCFBF8;
      --card: #FFFFFF;
      --ink: #17251E;
      --muted: #6C7A72;
      --line: #E5E9E5;
      --accent: #1F8A5B;      /* 参加＝進む の緑 */
      --accent-press: #176d48;
      --danger: #C2410C;
      --radius: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Noto Sans JP", "Yu Gothic", sans-serif;
      line-height: 1.6;
      padding: 24px 18px calc(28px + env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }
    .eyebrow { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
    h1 { font-size: 22px; margin: 4px 0 20px; font-weight: 700; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    }
    .name { font-size: 20px; font-weight: 700; }
    .hint { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
    .header { text-align: center; }
    .header-img { width: 100%; height: auto; display: block; border-radius: 16px; margin: 4px 0 12px; }
    .event-date { font-size: 17px; font-weight: 800; color: var(--accent); margin: 0 0 4px; }
    .event-meta { font-size: 14px; color: var(--muted); margin: 0 0 20px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
    input {
      width: 100%; height: 52px; padding: 0 14px; font-size: 16px;
      border: 1px solid var(--line); border-radius: 12px; background: #fff;
    }
    input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    button {
      width: 100%; height: 54px; font-size: 17px; font-weight: 700;
      border: 0; border-radius: 12px; cursor: pointer; margin-top: 18px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:active { background: var(--accent-press); }
    .btn-primary:disabled { opacity: .55; }
    .btn-text {
      background: transparent; color: var(--accent); height: auto;
      margin-top: 14px; text-decoration: underline; font-weight: 600;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .center { text-align: center; }
    .big-check {
      width: 64px; height: 64px; margin: 8px auto 12px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 34px;
      display: flex; align-items: center; justify-content: center;
    }
    .err { color: var(--danger); font-size: 14px; margin-top: 10px; }
    .spinner {
      width: 34px; height: 34px; margin: 40px auto; border-radius: 50%;
      border: 3px solid var(--line); border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <header class="header">
    <img class="header-img" src="header-join.png" alt="西三河まちつなぎ会 交流会参加受付" />
    <p class="event-date" id="eventDate"></p>
    <p class="event-meta" id="eventMeta"></p>
  </header>

  <!-- 読み込み中 -->
  <section id="s-loading" class="screen active">
    <div class="spinner"></div>
    <p class="center hint">読み込んでいます…</p>
  </section>

  <!-- 会員: 登録情報の確認・一言を添えて参加 -->
  <section id="s-member" class="screen">
    <div class="card">
      <p class="name"><span id="memberName"></span> さん</p>
      <p class="hint" id="memberHint">このイベントに参加しますか？</p>

      <div id="profileView" style="margin-top:16px;padding:14px;background:var(--field, #F1F5F1);border-radius:12px;font-size:14px;line-height:1.9;">
        <div>会社名：<span id="pCompany"></span></div>
        <div>職種：<span id="pJob"></span></div>
        <div>電話番号：<span id="pPhone"></span></div>
        <div>市：<span id="pCity"></span></div>
      </div>
      <button type="button" id="btnEditProfile" style="width:auto;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:0;margin-top:8px;height:auto;box-shadow:none;">登録情報が違う場合はこちら</button>

      <div id="profileEdit" style="display:none;margin-top:12px;">
        <label for="pName" style="display:block;font-size:13px;font-weight:600;margin:10px 0 4px;">お名前</label>
        <input id="pName" type="text" style="width:100%;height:46px;padding:0 12px;font-size:15px;border:1px solid var(--line);border-radius:10px;" />
        <label for="pCompanyInput" style="display:block;font-size:13px;font-weight:600;margin:10px 0 4px;">会社名</label>
        <input id="pCompanyInput" type="text" style="width:100%;height:46px;padding:0 12px;font-size:15px;border:1px solid var(--line);border-radius:10px;" />
        <label for="pJobInput" style="display:block;font-size:13px;font-weight:600;margin:10px 0 4px;">職種</label>
        <input id="pJobInput" type="text" style="width:100%;height:46px;padding:0 12px;font-size:15px;border:1px solid var(--line);border-radius:10px;" />
        <label for="pPhoneInput" style="display:block;font-size:13px;font-weight:600;margin:10px 0 4px;">電話番号</label>
        <input id="pPhoneInput" type="tel" inputmode="numeric" style="width:100%;height:46px;padding:0 12px;font-size:15px;border:1px solid var(--line);border-radius:10px;" />
        <label for="pCityInput" style="display:block;font-size:13px;font-weight:600;margin:10px 0 4px;">市</label>
        <input id="pCityInput" type="text" style="width:100%;height:46px;padding:0 12px;font-size:15px;border:1px solid var(--line);border-radius:10px;" />
        <p class="err" id="profileErr" style="display:none;"></p>
      </div>

      <label for="mComment" style="display:block;font-size:14px;font-weight:600;margin:16px 0 6px;">一言（任意）</label>
      <textarea id="mComment" rows="2" placeholder="例：〇〇やってます。よろしくお願いします。" style="width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:#fff;resize:vertical;font-family:inherit;"></textarea>
      <p class="hint" style="margin-top:6px;">当日配布される参加者リストに記載されます。</p>
    </div>
    <button class="btn-primary" id="btnJoinMember">参加する</button>
  </section>

  <!-- 未紐付け: 電話番号で照合 -->
  <section id="s-phone" class="screen">
    <div class="card">
      <p class="hint">会員登録がお済みの方は、登録した電話番号を入力してください。照合できれば次回からワンタップで参加できます。</p>
      <label for="phoneInput">電話番号</label>
      <input id="phoneInput" type="tel" inputmode="numeric" autocomplete="tel" placeholder="09012345678" />
      <p class="err" id="phoneErr" style="display:none"></p>
    </div>
    <button class="btn-primary" id="btnLink">確認して参加する</button>
    <button class="btn-text" id="btnToGuest">会員登録がまだの方はこちら</button>
  </section>

  <!-- 非会員: 都度フォーム -->
  <section id="s-guest" class="screen">
    <div class="card">
      <p class="hint">参加に必要な情報を入力してください。</p>
      <label for="gName">お名前</label>
      <input id="gName" type="text" autocomplete="name" placeholder="山田 太郎" />
      <label for="gCompany">会社名</label>
      <input id="gCompany" type="text" autocomplete="organization" placeholder="株式会社◯◯" />
      <label for="gJob">職種</label>
      <input id="gJob" type="text" autocomplete="organization-title" placeholder="例：営業／設計／代表" />
      <label for="gPhone">電話番号</label>
      <input id="gPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="09012345678" />
      <label for="gComment">一言</label>
      <textarea id="gComment" rows="2" placeholder="例：〇〇やってます。よろしくお願いします。" style="width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:#fff;resize:vertical;font-family:inherit;"></textarea>
      <p class="hint" style="margin-top:6px;">当日配布される参加者リストに記載されます。</p>
      <label for="gAddress" style="margin-top:16px;">市</label>
      <input id="gAddress" type="text" placeholder="例：岡崎市" />
      <p class="err" id="guestErr" style="display:none"></p>
    </div>
    <button class="btn-primary" id="btnJoinGuest">参加する</button>
  </section>

  <!-- 完了 -->
  <section id="s-done" class="screen center">
    <div class="big-check">✓</div>
    <p class="name">参加を受け付けました</p>
    <p class="hint" id="doneMsg"></p>
  </section>

  <!-- エラー -->
  <section id="s-error" class="screen center">
    <p class="name">うまくいきませんでした</p>
    <p class="hint" id="errMsg"></p>
    <button class="btn-primary" id="btnRetry">もう一度ひらく</button>
  </section>

  <script>
    // ===== 設定（ここを埋める）=====
    const LIFF_ID = '2010633156-dPg94lrL';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXhl189-cAnc88kJYBAxVTPL6sqpHPxli5GpG-HXin1JPGePWp00Iv3JjoPhWXa1ir/exec';

    const params = new URLSearchParams(location.search);
    let EVENT_ID = params.get('event') || '';
    let EVENT_TITLE = params.get('title') || '交流会';

    let accessToken = null;

    const $ = (id) => document.getElementById(id);
    function show(id) {
      document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
      $(id).classList.add('active');
    }
    function fail(msg) { $('errMsg').textContent = msg || '通信に失敗しました。'; show('s-error'); }

    // text/plain で送ると CORS のプリフライトを回避できる（GASの定番パターン）
    async function callGas(payload) {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ accessToken: accessToken }, payload)),
      });
      return res.json();
    }

    async function init() {
      $('eventDate').textContent = EVENT_TITLE;
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        accessToken = liff.getAccessToken();
        if (!accessToken) return fail('ログイン情報が取得できませんでした。LINE内で開き直してください。');

        // 直近の開催回を自動取得（開催予定シートから）
        const ne = await callGas({ action: 'nextEvent' });
        if (ne && ne.eventId) { EVENT_ID = ne.eventId; EVENT_TITLE = ne.title; }
        $('eventDate').textContent = EVENT_TITLE;
        $('eventMeta').textContent = [ne && ne.time, ne && ne.place].filter(Boolean).join(' ／ ');

        const r = await callGas({ action: 'checkMember' });
        if (r.status === 'member') {
          showMemberScreen(r);
        } else {
          show('s-phone');
        }
      } catch (e) {
        fail(String((e && e.message) || e));
      }
    }

    // 会員画面に、登録情報の表示欄・編集欄を反映して開く
    function showMemberScreen(r) {
      $('memberName').textContent = r.name;
      $('memberHint').textContent = '「' + EVENT_TITLE + '」に参加しますか？';
      $('pCompany').textContent = r.company || '（未登録）';
      $('pJob').textContent = r.job || '（未登録）';
      $('pPhone').textContent = r.phone || '（未登録）';
      $('pCity').textContent = r.city || '（未登録）';
      $('pName').value = r.name || '';
      $('pCompanyInput').value = r.company || '';
      $('pJobInput').value = r.job || '';
      $('pPhoneInput').value = r.phone || '';
      $('pCityInput').value = r.city || '';
      $('profileView').style.display = '';
      $('profileEdit').style.display = 'none';
      $('btnEditProfile').textContent = '登録情報が違う場合はこちら';
      show('s-member');
    }

    $('btnEditProfile').addEventListener('click', () => {
      const editing = $('profileEdit').style.display !== 'none';
      $('profileEdit').style.display = editing ? 'none' : '';
      $('profileView').style.display = editing ? '' : 'none';
      $('btnEditProfile').textContent = editing ? '登録情報が違う場合はこちら' : 'キャンセルして戻る';
    });

    // 会員: 一言（＋修正があれば登録情報も更新）して参加
    $('btnJoinMember').addEventListener('click', async (ev) => {
      const editing = $('profileEdit').style.display !== 'none';
      if (editing) {
        const name = $('pName').value.trim();
        const company = $('pCompanyInput').value.trim();
        const job = $('pJobInput').value.trim();
        const phone = $('pPhoneInput').value.trim();
        const city = $('pCityInput').value.trim();
        $('profileErr').style.display = 'none';
        if (!name || !company || !job || !phone || !city) {
          $('profileErr').textContent = 'すべての項目を入力してください。';
          $('profileErr').style.display = 'block';
          return;
        }
        ev.target.disabled = true;
        try {
          const u = await callGas({ action: 'updateProfile', name: name, company: company, job: job, phone: phone, city: city });
          if (u.status !== 'updated') { fail(u.message || '更新に失敗しました。'); return; }
          showMemberScreen(u); // 表示を更新して、そのまま参加へ
        } catch (e) { fail(String(e)); return; }
        finally { ev.target.disabled = false; }
      }
      ev.target.disabled = true;
      try {
        const comment = $('mComment').value.trim();
        const r = await callGas({ action: 'join', kind: 'member', eventId: EVENT_ID, comment: comment });
        finishJoin(r);
      } catch (e) { fail(String(e)); }
    });

    // 電話で照合
    $('btnLink').addEventListener('click', async (ev) => {
      const phone = $('phoneInput').value.trim();
      $('phoneErr').style.display = 'none';
      if (!phone) { $('phoneErr').textContent = '電話番号を入力してください。'; $('phoneErr').style.display = 'block'; return; }
      ev.target.disabled = true;
      try {
        const r = await callGas({ action: 'linkByPhone', phone: phone });
        if (r.status === 'linked') {
          // 照合できたら、登録情報の確認・一言画面へ
          showMemberScreen(r);
        } else {
          // 照合できなければ非会員フォームへ（入力済みの電話を引き継ぐ）
          $('gPhone').value = phone;
          show('s-guest');
        }
      } catch (e) { fail(String(e)); }
      finally { ev.target.disabled = false; }
    });

    $('btnToGuest').addEventListener('click', () => {
      $('gPhone').value = $('phoneInput').value.trim();
      show('s-guest');
    });

    // 非会員: 都度フォーム
    $('btnJoinGuest').addEventListener('click', async (ev) => {
      const name = $('gName').value.trim();
      const company = $('gCompany').value.trim();
      const job = $('gJob').value.trim();
      const phone = $('gPhone').value.trim();
      const address = $('gAddress').value.trim();
      const comment = $('gComment').value.trim();
      $('guestErr').style.display = 'none';
      if (!name || !company || !job || !phone || !comment || !address) {
        $('guestErr').textContent = 'すべての項目を入力してください。';
        $('guestErr').style.display = 'block';
        return;
      }
      ev.target.disabled = true;
      try {
        const r = await callGas({
          action: 'join', kind: 'guest', eventId: EVENT_ID,
          name: name, company: company, job: job, phone: phone, address: address, comment: comment,
        });
        finishJoin(r);
      } catch (e) { fail(String(e)); }
    });

    $('btnRetry').addEventListener('click', () => location.reload());

    function finishJoin(r) {
      if (r && r.status === 'joined') {
        $('doneMsg').textContent = 'ありがとうございます。当日お会いできるのを楽しみにしています。お名前は当日配布されるリストに記載されます。';
        show('s-done');
      } else if (r && r.status === 'already') {
        $('doneMsg').textContent = 'すでに参加登録済みです。';
        show('s-done');
      } else {
        fail((r && r.message) || '登録に失敗しました。');
      }
    }

    init();
  </script>
</body>
</html>
