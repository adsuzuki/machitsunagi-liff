<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>会員登録｜西三河まちつなぎ会</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg: #F6F8F5;
      --card: #FFFFFF;
      --ink: #15241C;
      --muted: #667A6E;
      --line: #E1E8E2;
      --field: #F1F5F1;
      --accent: #1E8A59;
      --accent-deep: #14663F;
      --accent-soft: #E4F3EA;
      --danger: #C2410C;
      --radius: 18px;
      --shadow: 0 1px 2px rgba(20,60,40,.05), 0 10px 30px rgba(20,60,40,.07);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Noto Sans JP", "Yu Gothic", sans-serif;
      line-height: 1.65;
      padding: 0 16px calc(32px + env(safe-area-inset-bottom));
      max-width: 460px; margin: 0 auto;
    }

    /* ヘッダー */
    .header { padding: 0; }
    .header-img { width: 100%; height: auto; display: block; border-radius: 16px; margin: 16px 0 22px; }
    .eyebrow { font-size: 12.5px; color: var(--accent-deep); font-weight: 700; letter-spacing: .08em; }
    h1 { font-size: 25px; margin: 6px 0 6px; font-weight: 800; letter-spacing: .01em; }
    .lead { font-size: 14px; color: var(--muted); margin: 0; }

    .card { background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 22px 20px; }

    label { display: block; font-size: 13.5px; font-weight: 700; margin: 18px 0 7px; }
    label:first-of-type { margin-top: 4px; }
    .opt { color: var(--muted); font-weight: 600; font-size: 12px; margin-left: 6px; }
    input {
      width: 100%; height: 54px; padding: 0 15px; font-size: 16px; color: var(--ink);
      border: 1.5px solid transparent; border-radius: 13px; background: var(--field);
      transition: border-color .15s, background .15s;
    }
    input::placeholder { color: #A6B3AB; }
    input:focus { outline: none; background: #fff; border-color: var(--accent); }
    .fieldnote { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }

    button {
      width: 100%; height: 56px; font-size: 17px; font-weight: 800; letter-spacing: .02em;
      border: 0; border-radius: 14px; cursor: pointer; margin-top: 24px; color: #fff;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
      box-shadow: 0 6px 16px rgba(20,102,63,.28);
      transition: transform .06s, box-shadow .15s, opacity .15s;
    }
    button:active { transform: translateY(1px); box-shadow: 0 3px 10px rgba(20,102,63,.24); }
    button:disabled { opacity: .55; box-shadow: none; }

    .err { color: var(--danger); font-size: 13.5px; margin-top: 12px; display: none; font-weight: 600; }

    .screen { display: none; } .screen.active { display: block; }
    .center { text-align: center; }
    .big-check {
      width: 72px; height: 72px; margin: 12px auto 16px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }
    .big-check svg { width: 34px; height: 34px; }
    .result-title { font-size: 21px; font-weight: 800; margin: 0 0 8px; }
    .result-msg { font-size: 14.5px; color: var(--muted); margin: 0; }

    .spinner { width: 36px; height: 36px; margin: 64px auto; border-radius: 50%;
      border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } button:active { transform: none; } }
  </style>
</head>
<body>
  <header class="header">
    <img class="header-img" src="header.png" alt="西三河まちつなぎ会 会員登録" />
  </header>

  <section id="s-loading" class="screen active">
    <div class="spinner"></div>
    <p class="center" style="color:var(--muted);font-size:14px;">読み込んでいます…</p>
  </section>

  <!-- 登録フォーム -->
  <section id="s-form" class="screen">
    <div class="card">
      <label for="name">お名前</label>
      <input id="name" type="text" autocomplete="name" placeholder="山田 太郎" />

      <label for="company">会社名</label>
      <input id="company" type="text" autocomplete="organization" placeholder="株式会社◯◯" />

      <label for="phone">電話番号</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="09012345678" />
      <p class="fieldnote">LINEと紐づけて、次回からの参加を簡単にするために使います。</p>

      <label for="city">市 <span class="opt">任意</span></label>
      <input id="city" type="text" placeholder="例：岡崎市" />

      <p class="err" id="formErr"></p>
    </div>
    <button id="btnRegister">登録する</button>
  </section>

  <!-- 登録済み -->
  <section id="s-exists" class="screen center">
    <div class="big-check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <p class="result-title"><span id="existsName"></span> さん</p>
    <p class="result-msg">すでに会員登録がお済みです。交流会の参加はメニューの「交流会に参加」からどうぞ。</p>
  </section>

  <!-- 完了 -->
  <section id="s-done" class="screen center">
    <div class="big-check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <p class="result-title">登録が完了しました</p>
    <p class="result-msg">ありがとうございます。次回から交流会にワンタップで参加できます。</p>
  </section>

  <!-- エラー -->
  <section id="s-error" class="screen center">
    <p class="result-title">うまくいきませんでした</p>
    <p class="result-msg" id="errMsg"></p>
    <button id="btnRetry" style="max-width:240px;margin-left:auto;margin-right:auto;">もう一度ひらく</button>
  </section>

  <script>
    // ===== 設定 =====
    const LIFF_ID = '2010633156-6XBOLrvg';   // 会員登録用のLIFF ID
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXhl189-cAnc88kJYBAxVTPL6sqpHPxli5GpG-HXin1JPGePWp00Iv3JjoPhWXa1ir/exec';

    let idToken = null;
    const $ = (id) => document.getElementById(id);
    function show(id) {
      document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
      $(id).classList.add('active');
    }
    function fail(msg) { $('errMsg').textContent = msg || '通信に失敗しました。'; show('s-error'); }

    async function callGas(payload) {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ idToken: idToken }, payload)),
      });
      return res.json();
    }

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        idToken = liff.getIDToken();
        if (!idToken) return fail('ログイン情報が取得できませんでした。LINE内で開き直してください。');

        const r = await callGas({ action: 'checkMember' });
        if (r.status === 'member') { $('existsName').textContent = r.name; show('s-exists'); }
        else { show('s-form'); }
      } catch (e) { fail(String((e && e.message) || e)); }
    }

    $('btnRegister').addEventListener('click', async (ev) => {
      const name = $('name').value.trim();
      const company = $('company').value.trim();
      const phone = $('phone').value.trim();
      const city = $('city').value.trim();
      $('formErr').style.display = 'none';
      if (!name || !company || !phone) {
        $('formErr').textContent = 'お名前・会社名・電話番号は必須です。';
        $('formErr').style.display = 'block';
        return;
      }
      ev.target.disabled = true;
      try {
        const r = await callGas({ action: 'register', name: name, company: company, phone: phone, city: city });
        if (r.status === 'registered') show('s-done');
        else if (r.status === 'exists') { $('existsName').textContent = r.name; show('s-exists'); }
        else fail(r.message || '登録に失敗しました。');
      } catch (e) { fail(String(e)); }
      finally { ev.target.disabled = false; }
    });

    $('btnRetry').addEventListener('click', () => location.reload());
    init();
  </script>
</body>
</html>
